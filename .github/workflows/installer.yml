# Builds the one-click installer for each platform and attaches it to the release.
#
# Constructor has to run on the system it targets, so each installer is built on its own runner.
# Triggered by a tag, and manually while the recipe is being tried out.
name: installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  FPOCKET_VERSION: "4.2.3"

jobs:
  # conda-forge has no win-64 fpocket, so the Windows installer carries one built here from
  # the patches in contrib/fpocket-windows. Cross-compiled from Linux because that is where
  # mingw-w64 is one apt-get away; the result is a static .exe importing only KERNEL32 and
  # msvcrt. Drop this job the day the feedstock gains win-64.
  fpocket-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the cross compiler
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Build fpocket for Windows
        run: |
          git clone --depth 1 --branch "$FPOCKET_VERSION" https://github.com/Discngine/fpocket.git /tmp/fpocket
          cd /tmp/fpocket
          git apply "$GITHUB_WORKSPACE"/contrib/fpocket-windows/*.patch
          CC=x86_64-w64-mingw32-gcc bash "$GITHUB_WORKSPACE/contrib/fpocket-windows/build-windows.sh" \
              /tmp/fpocket "$GITHUB_WORKSPACE/vendor"
          # Fail loudly rather than ship an installer with no cavity detection.
          for exe in fpocket tpocket dpocket; do
              test -s "$GITHUB_WORKSPACE/vendor/$exe.exe" || { echo "missing $exe.exe"; exit 1; }
          done
          file "$GITHUB_WORKSPACE"/vendor/*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: fpocket-windows
          path: vendor/*.exe

  build:
    needs: fpocket-windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: PoliScreen-Windows-x86_64
          - os: ubuntu-latest
            artifact: PoliScreen-Linux-x86_64
          - os: macos-latest
            artifact: PoliScreen-macOS-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Only the Windows recipe references these; the other two resolve fpocket from conda-forge.
      - name: Collect fpocket
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v4
        with:
          name: fpocket-windows
          path: installer/vendor

      # The base environment is used as it comes: creating one only to run constructor from it
      # failed on Windows, where the new environment was not there to activate. `defaults` is
      # removed because its terms of service stop a non-interactive build.
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge
          conda-remove-defaults: "true"

      - name: Build the wheel
        shell: bash -el {0}
        run: |
          python -m pip install --upgrade build
          python -m build --wheel --outdir dist
          ls -l dist

      - name: Build the installer
        shell: bash -el {0}
        run: |
          conda install -y -c conda-forge constructor
          constructor installer/ --output-dir out
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*

      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
