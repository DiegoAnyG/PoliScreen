# PoliScreen interface configuration.
#
# Read only when Streamlit starts with this directory as its working directory. The container does
# (WORKDIR /opt/poliscreen); the Windows installer ships no .streamlit and so loads none of this.
# That asymmetry is why the same build had an appearance switcher on Windows and not in the
# container: a loaded [theme] block replaces Streamlit's own theme choice. Keeping the block is a
# deliberate trade -- the accent colour and the widget borders in exchange for the switcher -- so
# the theme is chosen here instead, and `dark` is the default.
#
# Override at start without editing this file: POLISCREEN_THEME=light, which compose and the
# launcher pass through as STREAMLIT_THEME_BASE.
[theme]
base = "dark"
primaryColor = "#2E9E7E"
showWidgetBorder = true
borderColor = "#4A4A4A"
baseRadius = "small"

[server]
address = "127.0.0.1"
headless = true

[browser]
gatherUsageStats = false
