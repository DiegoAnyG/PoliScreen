# PoliScreen interface configuration.
#
# No [theme] block, and that is the point.
#
# `base` was removed first, because pinning it made the page and the runtime disagree about which
# theme was in use and the brand inverted to white on white. Then the rest of the block turned out
# to cost more: this file is read only when Streamlit starts with this directory as its working
# directory, which the container does (WORKDIR /opt/poliscreen) and the Windows installer does not
# (it ships no .streamlit). So the same build had a theme switcher on Windows and none in the
# container -- the difference was never Docker, it was whether these options were loaded at all.
#
# An accent colour is worth less than being able to read the screen at night. For a container that
# has to start dark regardless, POLISCREEN_THEME=dark sets STREAMLIT_THEME_BASE in compose and in
# the launcher.

[server]
address = "127.0.0.1"
headless = true

[browser]
gatherUsageStats = false
