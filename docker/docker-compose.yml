# Start with one command:
#   docker compose -f docker/docker-compose.yml up --build
#   -> http://localhost:8501
#
# Projects live in ./proyectos on the host, mounted as /data in the container, so results
# survive rebuilding or deleting the image.
services:
  poliscreen:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: poliscreen:latest
    ports:
      # This machine only. To expose it on the local network use "8501:8501", bearing in mind
      # that the interface has no authentication.
      - "127.0.0.1:8501:8501"
    volumes:
      - ../proyectos:/data
    environment:
      # Optional ADMET engine. Without it screening works the same; only analogue design and
      # ADMET prediction are disabled.
      POLISCREEN_ADME_PYTHON: ${POLISCREEN_ADME_PYTHON:-}
      POLISCREEN_ADME_ROOT: ${POLISCREEN_ADME_ROOT:-}
    restart: unless-stopped
