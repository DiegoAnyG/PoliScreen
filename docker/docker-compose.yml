# Start with one command:
#   docker compose -f docker/docker-compose.yml up --build
#   -> http://localhost:8501
#
# Projects live in ./proyectos on the host, mounted as /data in the container, so results
# survive rebuilding or deleting the image.
services:
  poliscreen:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      # ADMET on by default; the other two off. scripts/install-windows.ps1 sets all three
      # from -NoAdmet, -WithAdcp and -WithGnina.
      args:
        WITH_ADMET: ${POLISCREEN_WITH_ADMET:-1}
        WITH_ADCP: ${POLISCREEN_WITH_ADCP:-0}
        WITH_GNINA: ${POLISCREEN_WITH_GNINA:-0}
    image: poliscreen:latest
    ports:
      # This machine only. To expose it on the local network use "8501:8501", bearing in mind
      # that the interface has no authentication.
      - "127.0.0.1:8501:8501"
    volumes:
      - ../proyectos:/data
    environment:
      # These default to the copy the image builds, so leaving them alone is the normal case.
      # An empty default would override the Dockerfile ENV with an empty string and break the
      # engine, which is why the paths are repeated here rather than left blank. Set them on
      # the host only to point at a checkout of your own; with WITH_ADMET=0 they point at
      # nothing and the bridge reports the engine as unavailable, which is handled.
      POLISCREEN_ADME_PYTHON: ${POLISCREEN_ADME_PYTHON:-/opt/conda/envs/admet/bin/python}
      POLISCREEN_ADME_ROOT: ${POLISCREEN_ADME_ROOT:-/opt/adme}
    # Ctrl+C has to stop everything and leave nothing behind, the way the Windows launcher does.
    # Two things were in the way.
    #
    # `restart: unless-stopped` is the obvious one: it brings the container back after a crash and
    # starts it again when Docker Desktop next starts, which is precisely the parasite process
    # this is meant not to leave. A screening is something you start, not a service.
    #
    # `init` is the quiet one. streamlit is PID 1 in the container, and PID 1 is exempt from the
    # default signal handlers: Python installs one for SIGINT but not for SIGTERM, so the SIGTERM
    # compose sends on Ctrl+C was ignored, and the container was SIGKILLed ten seconds later with
    # the run half-written. tini takes PID 1, forwards the signal to streamlit and reaps whatever
    # the docking left behind.
    init: true
