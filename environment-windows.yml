# PoliScreen environment for native Windows (no WSL, no Docker).
#
#   conda env create -f environment-windows.yml
#   conda activate poliscreen
#   pip install -e .
#   powershell -ExecutionPolicy Bypass -File scripts\get_vina.ps1
#
# No fpocket: conda-forge does not build it for Windows, so automatic cavity detection is not
# available. Everything else works the same, and the search box can be centred on the
# co-crystallized ligand, which is the recommended option anyway. For cavity detection on
# Windows, use the Docker image (docs/INSTALL.md).
name: poliscreen
channels:
  - conda-forge
dependencies:
  - python=3.11
  - rdkit=2025.03
  - openbabel=3.1
  - plip=3.0
  - openmm=8.5
  - pdbfixer
  - biopython=1.87
  - py3dmol=2.5
  - pandas=3.0
  - numpy=2.4
  - scipy=1.17
  - matplotlib=3.10
  - openpyxl=3.1
  - pip
  - pip:
      - streamlit==1.59.2
