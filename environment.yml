# Reproducible environment for PoliScreen.
#
#   conda env create -f environment.yml
#   conda activate poliscreen
#   pip install -e .
#   bash scripts/get_vina.sh
#
# Vina 1.2.x is not on conda: bioconda ships autodock-vina 1.1.2 (2011), whose scoring function
# is a different one and gives different numbers. The official binary is pinned by get_vina.sh.
name: poliscreen
channels:
  - conda-forge
dependencies:
  - python=3.11
  - rdkit=2025.03
  - openbabel=3.1
  - plip=3.0.1
  - fpocket=4.2
  - openmm=8.5
  - pdbfixer=1.12
  - biopython=1.87
  - py3dmol=2.5
  - pandas=3.0
  - numpy=2.4
  - scipy=1.17
  - matplotlib=3.10
  - openpyxl=3.1
  - pip
  - pip:
      - streamlit==1.59.2
