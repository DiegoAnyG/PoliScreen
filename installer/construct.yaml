# Recipe for the one-click installer, built with conda constructor.
#
#   conda install -c conda-forge constructor
#   constructor installer/            # run on the target platform
#
# It ships the whole environment, so the user installs nothing else: no conda, no Python.
# Vina is not a conda package: on Windows it rides along, fetched and verified by the release
# workflow; on Linux and macOS post_install still downloads it at install time.
#
# The optional engines are deliberately absent:
#   ADCP   the Scripps suite is downloaded accepting an academic licence, so it cannot be
#          redistributed, and it is only built for Linux.
#   gnina  2 GB plus the CUDA runtime, and useless without an NVIDIA GPU.
#   ADMET-AI  torch and its model weights, and admelab only needs it for the ML predictions.
#             admelab itself does travel here, so the analogue design works out of the box; the
#             predictions degrade to RDKit descriptors until the extra environment exists.
# The first two are installed afterwards with scripts/get_adcp.sh and scripts/get_gnina.sh; the
# third is described in docs/INSTALL.md.
#
# fpocket comes from conda-forge on Linux and macOS. There is no win-64 build there, so the
# release workflow cross-compiles one from contrib/fpocket-windows and leaves it in vendor/,
# and the Windows recipe picks it up below. Remove that when the feedstock gains win-64.
#
# The `# [win]` comments are constructor's platform selectors, resolved before the YAML is
# parsed, which is why the same key can appear more than once.

name: PoliScreen
version: 1.0.0
company: Anaya Guerrero DC

channels:
  - conda-forge

specs:
  - python 3.11.*
  - rdkit 2025.03.*
  - openbabel 3.1.*
  - plip 3.0.*
  - openmm 8.5.*
  # Pinned like every other one, and to the same version as environment.yml. Left open, the
  # installer solved a different pdbfixer from the development environment, and pdbfixer and
  # openmm are what build the prepared receptor: two machines then dock a structure that is not
  # the same one, and every number downstream moves with it.
  - pdbfixer 1.12.*
  - biopython 1.87.*
  - py3dmol 2.5.*
  - pandas 3.0.*
  - numpy 2.4.*
  - scipy 1.17.*
  - matplotlib-base
  - openpyxl
  - streamlit 1.59.*
  - pip
  - fpocket 4.2.*                     # [not win]
  # admelab's own dependencies, minus ADMET-AI. Everything else it needs (rdkit, pandas, numpy,
  # openpyxl) is already above; these three are only reached by its naming and domain code.
  - requests
  - pubchempy
  - tqdm

license_file: ../LICENSE
initialize_by_default: false
register_python_default: false
keep_pkgs: false

# The wheel is built by the release workflow before constructor runs. The scripts travel with the
# installer because post_install calls get_vina, and because the optional engines are installed
# from them afterwards.
extra_files:
  - ../dist/poliscreen-1.0.0-py3-none-any.whl
  # The design/ADMET engine, without ADMET-AI: the analogue design and the reaction filter work
  # from RDKit alone, and admelab falls back to its own descriptors when the ML half is absent.
  # The release workflow builds this wheel; keep the version in step with ADMELAB_VERSION there.
  - ../dist/admelab-0.3.0-py3-none-any.whl
  - launcher.bat: PoliScreen.bat       # [win]
  - launcher.sh: PoliScreen            # [not win]
  # Library/bin is where conda keeps non-Python executables on Windows, and the launcher
  # already puts it on PATH, so shutil.which("fpocket") finds it like any other tool.
  # Vina rides along instead of being downloaded on the user's machine: one failed download there
  # left the whole screening without a docking engine. The release workflow verifies its SHA256.
  - vendor/vina.exe: Scripts/vina.exe                                      # [win]
  - vendor/AutoDock-Vina-LICENSE.txt: Scripts/AutoDock-Vina-LICENSE.txt    # [win]
  - vendor/fpocket.exe: Library/bin/fpocket.exe   # [win]
  - vendor/tpocket.exe: Library/bin/tpocket.exe   # [win]
  - vendor/dpocket.exe: Library/bin/dpocket.exe   # [win]
  - ../scripts/get_vina.ps1: scripts/get_vina.ps1
  - ../scripts/get_vina.sh: scripts/get_vina.sh
  - ../scripts/get_adcp.sh: scripts/get_adcp.sh
  - ../scripts/get_gnina.sh: scripts/get_gnina.sh

post_install: post_install.bat        # [win]
post_install: post_install.sh         # [not win]
